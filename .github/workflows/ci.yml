name: Node.js CI

on:
  workflow_dispatch:        # manual trigger
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history, needed for secret scanning below

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check for leftover commented-out code and TODO/FIXME markers
        run: |
          # Flags commented-out code (a '//' followed by something that looks like a statement:
          # const/let/var/function/import/export/if/return, or a call like `foo(...)`), plus any
          # TODO/FIXME/XXX marker. This is a heuristic, not a parser - it will have false positives
          # on legitimate comments that happen to start with these words; adjust the pattern below
          # as needed rather than treating it as gospel.
          PATTERN='//\s*(const|let|var|function|import|export|if\s*\(|return\b)|//\s*[a-zA-Z_$][a-zA-Z0-9_$]*\([^)]*\)\s*;?\s*$|TODO|FIXME|XXX'
          FOUND=0
          # grep -n gives "file:line:content" - split on the first two colons only, so a colon
          # inside the code itself (e.g. an object literal) doesn't shift the fields.
          while IFS=: read -r file line content; do
            [ -z "$file" ] && continue
            FOUND=1
            # ::error file=...,line=...:: makes GitHub annotate this exact line inline,
            # both in the PR "Files changed" diff and in the workflow run's Checks tab.
            escaped=$(echo "$content" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=${file},line=${line}::Commented-out code or TODO/FIXME marker: ${escaped}"
          done < <(grep -rnE "$PATTERN" src tests --include='*.ts' --include='*.tsx' || true)

          if [ "$FOUND" -eq 1 ]; then
            echo "Remove dead code before merging, or resolve/track the TODO. See annotations above (and inline on the PR diff)."
            exit 1
          fi

      - name: Run Jest tests
        run: npm test

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}